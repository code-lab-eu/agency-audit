<table id="websites-table" class="websites-table table table-sm table-hover mb-0"
       hx-get="/htmx/country/{{ iso }}/websites"
       hx-trigger="discoveryComplete from:body"
       hx-swap="outerHTML">
    <thead class="table-light">
        <tr>
            <th>Website</th>
            <th class="text-end">Score</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for w in websites %}
        {% include "_website_row.html" %}
        {% else %}
        <tr><td colspan="4" class="text-muted text-center py-3">No websites discovered yet</td></tr>
        {% endfor %}
    </tbody>
</table>
