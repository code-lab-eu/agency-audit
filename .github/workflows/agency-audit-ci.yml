name: CI — Agency Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Install the exact versions pinned in uv.lock (same as local dev and
      # scripts/qa.sh). --locked fails if uv.lock is out of date with
      # pyproject.toml instead of silently resolving newer releases.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run --extra dev ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run --extra dev ruff format --check src/ tests/

      - name: No new DB mocks in tests
        run: uv run python scripts/check_test_db_mocks.py

      - name: Type check (mypy)
        run: uv run --extra dev mypy src/

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Install the exact versions pinned in uv.lock (same as local dev and
      # scripts/qa.sh). --locked fails if uv.lock is out of date with
      # pyproject.toml instead of silently resolving newer releases.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Set up test database
        env:
          AGENCY_AUDIT_PG_HOST: localhost
          AGENCY_AUDIT_PG_PORT: 5432
          AGENCY_AUDIT_PG_USER: testuser
          AGENCY_AUDIT_PG_PASSWORD: testpass
          AGENCY_AUDIT_PG_DATABASE: testdb
        run: uv run python scripts/seed-test-db.py

      - name: Run tests with coverage
        env:
          AGENCY_AUDIT_PG_HOST: localhost
          AGENCY_AUDIT_PG_PORT: 5432
          AGENCY_AUDIT_PG_USER: testuser
          AGENCY_AUDIT_PG_PASSWORD: testpass
          AGENCY_AUDIT_PG_DATABASE: testdb
        run: |
          uv run --extra dev pytest \
            --cov=src/agency_audit \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            tests/

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run --extra dev coverage report 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
